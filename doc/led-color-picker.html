<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FlyingRC LED 调色盘</title>
  <style>
    :root {
      color: #f5f7fb;
      background: #090d14;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--picked) 20%, transparent), transparent 34%),
        radial-gradient(circle at 85% 90%, color-mix(in srgb, var(--picked) 14%, transparent), transparent 32%),
        #090d14;
      transition: background 180ms ease;
    }

    main {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: minmax(280px, .9fr) minmax(320px, 1.1fr);
      overflow: hidden;
      border: 1px solid #252c38;
      border-radius: 28px;
      background: #111720;
      box-shadow: 0 28px 90px #0009;
    }

    .preview-panel {
      min-height: 520px;
      padding: 34px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--picked);
      color: var(--contrast);
      transition: background 120ms linear, color 120ms linear;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .72;
    }

    h1 {
      margin: 0;
      max-width: 8ch;
      font-size: clamp(42px, 7vw, 72px);
      line-height: .92;
      letter-spacing: -.065em;
    }

    .led {
      width: 92px;
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--contrast) 32%, transparent);
      border-radius: 50%;
      background: var(--picked);
      box-shadow:
        inset 0 0 24px color-mix(in srgb, white 28%, transparent),
        0 0 18px var(--picked),
        0 0 54px var(--picked);
    }

    .controls { padding: 34px; }

    .controls h2 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: -.03em;
    }

    .intro {
      margin: 0 0 26px;
      color: #9ca8b8;
      line-height: 1.55;
    }

    .picker-row {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }

    input[type="color"] {
      width: 74px;
      height: 58px;
      padding: 4px;
      border: 1px solid #333d4b;
      border-radius: 14px;
      background: #0b1018;
      cursor: pointer;
    }

    input[type="text"] {
      width: 100%;
      height: 58px;
      border: 1px solid #333d4b;
      border-radius: 14px;
      padding: 0 16px;
      outline: none;
      color: #f5f7fb;
      background: #0b1018;
      font: 700 19px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-transform: uppercase;
    }

    input[type="text"]:focus {
      border-color: var(--picked);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--picked) 22%, transparent);
    }

    .channels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .channel {
      padding: 12px;
      border: 1px solid #252d39;
      border-radius: 14px;
      color: #9ca8b8;
      background: #0c121a;
      font-size: 12px;
    }

    .channel strong {
      display: block;
      margin-top: 3px;
      color: #f5f7fb;
      font: 700 20px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .values { display: grid; gap: 10px; }

    .value-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 66px;
      padding: 11px 12px 11px 16px;
      border: 1px solid #252d39;
      border-radius: 15px;
      background: #0c121a;
    }

    .value-row small {
      display: block;
      margin-bottom: 4px;
      color: #788597;
      font-size: 11px;
    }

    output {
      font: 700 17px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    button {
      min-width: 58px;
      min-height: 40px;
      border: 1px solid #364151;
      border-radius: 11px;
      color: #e9edf4;
      background: #1a2330;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover { background: #253143; }
    button:focus-visible { outline: 3px solid var(--picked); outline-offset: 2px; }

    .presets {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .swatch {
      min-width: 0;
      width: 34px;
      min-height: 34px;
      padding: 0;
      border: 2px solid #ffffff38;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 1px #0008;
    }

    .hint {
      margin: 18px 0 0;
      color: #7f8b9b;
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
      .preview-panel { min-height: 280px; padding: 28px; }
      h1 { max-width: none; font-size: 48px; }
      .led { width: 64px; }
      .controls { padding: 28px 22px; }
    }
  </style>
</head>
<body style="--picked:#7d0000; --contrast:#ffffff">
  <main>
    <section class="preview-panel" aria-label="所选颜色预览">
      <div>
        <p class="eyebrow">FlyingRC · DroneCAN</p>
        <h1>LED Color</h1>
      </div>
      <div class="led" aria-hidden="true"></div>
    </section>

    <section class="controls">
      <h2>选择颜色</h2>
      <p class="intro">选择或输入颜色，即可得到 AM32 <code>LED_COLOR</code> 参数值。</p>

      <div class="picker-row">
        <input id="picker" type="color" value="#7d0000" aria-label="打开调色盘">
        <input id="hexInput" type="text" value="7D0000" maxlength="7" spellcheck="false" aria-label="RRGGBB 颜色编码">
      </div>

      <div class="channels" aria-label="RGB 通道值">
        <div class="channel">RED<strong id="red">125</strong></div>
        <div class="channel">GREEN<strong id="green">0</strong></div>
        <div class="channel">BLUE<strong id="blue">0</strong></div>
      </div>

      <div class="values">
        <div class="value-row">
          <div><small>RRGGBB</small><output id="rrggbb">7D0000</output></div>
          <button type="button" data-copy="rrggbb">复制</button>
        </div>
        <div class="value-row">
          <div><small>十六进制</small><output id="hexValue">0x7D0000</output></div>
          <button type="button" data-copy="hexValue">复制</button>
        </div>
        <div class="value-row">
          <div><small>DroneCAN LED_COLOR（十进制）</small><output id="decimal">8192000</output></div>
          <button type="button" data-copy="decimal">复制</button>
        </div>
      </div>

      <div class="presets" aria-label="常用颜色">
        <button class="swatch" type="button" style="--swatch:#7d0000" data-color="7D0000" aria-label="默认暗红"></button>
        <button class="swatch" type="button" style="--swatch:#ff0000" data-color="FF0000" aria-label="红色"></button>
        <button class="swatch" type="button" style="--swatch:#00ff00" data-color="00FF00" aria-label="绿色"></button>
        <button class="swatch" type="button" style="--swatch:#0000ff" data-color="0000FF" aria-label="蓝色"></button>
        <button class="swatch" type="button" style="--swatch:#ffffff" data-color="FFFFFF" aria-label="白色"></button>
        <button class="swatch" type="button" style="--swatch:#ff7800" data-color="FF7800" aria-label="橙色"></button>
        <button class="swatch" type="button" style="--swatch:#00d5ff" data-color="00D5FF" aria-label="青色"></button>
      </div>

      <p class="hint">使用手动颜色前，请将 <code>LED_MODE</code> 设为 <code>1</code>。颜色格式固定为 <code>0xRRGGBB</code>。</p>
    </section>
  </main>

  <script>
    const picker = document.querySelector('#picker');
    const hexInput = document.querySelector('#hexInput');
    const fields = {
      red: document.querySelector('#red'),
      green: document.querySelector('#green'),
      blue: document.querySelector('#blue'),
      rrggbb: document.querySelector('#rrggbb'),
      hexValue: document.querySelector('#hexValue'),
      decimal: document.querySelector('#decimal')
    };

    function normalize(value) {
      const clean = value.trim().replace(/^#|^0x/i, '').toUpperCase();
      return /^[0-9A-F]{6}$/.test(clean) ? clean : null;
    }

    function setColor(value) {
      const hex = normalize(value);
      if (!hex) return false;

      const numeric = Number.parseInt(hex, 16);
      const red = (numeric >> 16) & 0xff;
      const green = (numeric >> 8) & 0xff;
      const blue = numeric & 0xff;
      const luminance = .299 * red + .587 * green + .114 * blue;

      picker.value = `#${hex.toLowerCase()}`;
      hexInput.value = hex;
      fields.red.textContent = red;
      fields.green.textContent = green;
      fields.blue.textContent = blue;
      fields.rrggbb.textContent = hex;
      fields.hexValue.textContent = `0x${hex}`;
      fields.decimal.textContent = numeric;
      document.body.style.setProperty('--picked', `#${hex}`);
      document.body.style.setProperty('--contrast', luminance > 150 ? '#090d14' : '#ffffff');
      hexInput.setAttribute('aria-invalid', 'false');
      return true;
    }

    picker.addEventListener('input', event => setColor(event.target.value));
    hexInput.addEventListener('input', event => {
      if (!setColor(event.target.value)) hexInput.setAttribute('aria-invalid', 'true');
    });

    document.querySelectorAll('[data-color]').forEach(button => {
      button.addEventListener('click', () => setColor(button.dataset.color));
    });

    document.querySelectorAll('[data-copy]').forEach(button => {
      button.addEventListener('click', async () => {
        const original = button.textContent;
        try {
          await navigator.clipboard.writeText(fields[button.dataset.copy].textContent);
          button.textContent = '已复制';
        } catch {
          button.textContent = '复制失败';
        }
        window.setTimeout(() => { button.textContent = original; }, 1200);
      });
    });
  </script>
</body>
</html>
